<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="capyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with gamer glow -->
  <rect width="512" height="512" rx="128" fill="#0c0a14"/>
  <circle cx="256" cy="256" r="210" fill="url(#purpleGrad)" opacity="0.3"/>
  <circle cx="256" cy="256" r="190" fill="#151222" stroke="#7c3aed" stroke-width="8"/>

  <!-- Headset band -->
  <path d="M 140 250 A 130 130 0 0 1 372 250" fill="none" stroke="#a855f7" stroke-width="24" stroke-linecap="round"/>

  <!-- Capybara Head Base -->
  <path d="M 170 210 C 170 170 220 155 256 155 C 292 155 342 170 342 210 C 342 260 350 280 340 330 C 330 380 290 395 256 395 C 222 395 182 380 172 330 C 162 280 170 260 170 210 Z" fill="url(#capyGrad)"/>

  <!-- Capybara Muzzle -->
  <path d="M 210 285 C 210 260 230 250 256 250 C 282 250 302 260 302 285 C 302 335 285 365 256 365 C 227 365 210 335 210 285 Z" fill="#b45309"/>

  <!-- Nose & Mouth -->
  <ellipse cx="256" cy="285" rx="20" ry="12" fill="#451a03"/>
  <path d="M 256 297 L 256 325 M 244 325 Q 256 332 268 325" stroke="#451a03" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Eyes (Relaxed Gamer) -->
  <ellipse cx="215" cy="225" rx="8" ry="4" fill="#451a03"/>
  <ellipse cx="297" cy="225" rx="8" ry="4" fill="#451a03"/>

  <!-- Headset Ear Cushions (Glowing Purple) -->
  <rect x="120" y="215" width="36" height="70" rx="18" fill="#7c3aed" stroke="#c084fc" stroke-width="4"/>
  <rect x="356" y="215" width="36" height="70" rx="18" fill="#7c3aed" stroke="#c084fc" stroke-width="4"/>

  <!-- Headset Microphone -->
  <path d="M 140 270 Q 150 350 210 350" fill="none" stroke="#a855f7" stroke-width="8" stroke-linecap="round"/>
  <circle cx="215" cy="350" r="10" fill="#22c55e"/>

  <!-- Gamepad Icon at Bottom (Emblem) -->
  <rect x="196" y="380" width="120" height="70" rx="28" fill="#1e1a30" stroke="#a855f7" stroke-width="5"/>
  <!-- D-Pad -->
  <path d="M 226 405 L 226 425 M 216 415 L 236 415" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>
  <!-- Action Buttons -->
  <circle cx="278" cy="410" r="4" fill="#ec4899"/>
  <circle cx="292" cy="417" r="4" fill="#3b82f6"/>
  <circle cx="285" cy="426" r="4" fill="#10b981"/>
</svg>
