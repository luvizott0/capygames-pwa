name: Deploy Sandbox Homelab - CapyGames PWA

on:
  push:
    branches:
      - release
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  build-and-push:
    name: Build & Push Cloud (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir Nome da Imagem em Minúsculas
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Compilar e Enviar Imagem Docker para o GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Homelab (BMO)
    needs: build-and-push
    runs-on: [self-hosted]
    steps:
      - name: Autenticar no GHCR no Runner Local
        run: |
          echo "🔑 Autenticando Docker no GHCR..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Backup da Imagem Atual (Rollback Safety)
        run: |
          if docker image inspect capygames-pwa:latest >/dev/null 2>&1; then
            echo "💾 Imagem atual encontrada. Criando tag capygames-pwa:rollback-backup..."
            docker tag capygames-pwa:latest capygames-pwa:rollback-backup
          else
            echo "ℹ️ Nenhuma imagem capygames-pwa:latest existente para backup prévio."
          fi

      - name: Baixar Nova Imagem do GHCR
        run: |
          IMAGE_NAME="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest"
          echo "📥 Baixando imagem compilada na nuvem: $IMAGE_NAME..."
          if docker pull "$IMAGE_NAME"; then
            docker tag "$IMAGE_NAME" capygames-pwa:latest
          else
            echo "⚠️ Falha ao baixar do GHCR via token. Compilando localmente no homelab..."
            TARGET_DIR="${{ vars.CAPIHOUSE_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              if [ -n "$CAPIHOUSE_DIR" ]; then TARGET_DIR="$CAPIHOUSE_DIR";
              elif [ -f "$HOME/homelab/capihouse/docker-compose.yml" ]; then TARGET_DIR="$HOME/homelab/capihouse";
              elif [ -f "/opt/capihouse/docker-compose.yml" ]; then TARGET_DIR="/opt/capihouse";
              elif [ -f "$HOME/capihouse/docker-compose.yml" ]; then TARGET_DIR="$HOME/capihouse";
              elif [ -f "../docker-compose.yml" ]; then TARGET_DIR="..";
              else TARGET_DIR="."; fi
            fi
            docker compose --project-directory "$TARGET_DIR" -f "$TARGET_DIR/docker-compose.yml" build capygames-pwa
          fi

      - name: Executar Deploy
        run: |
          TARGET_DIR="${{ vars.CAPIHOUSE_DIR }}"
          if [ -z "$TARGET_DIR" ]; then
            if [ -n "$CAPIHOUSE_DIR" ]; then
              TARGET_DIR="$CAPIHOUSE_DIR"
            elif [ -f "$HOME/homelab/capihouse/docker-compose.yml" ]; then
              TARGET_DIR="$HOME/homelab/capihouse"
            elif [ -f "/opt/capihouse/docker-compose.yml" ]; then
              TARGET_DIR="/opt/capihouse"
            elif [ -f "$HOME/capihouse/docker-compose.yml" ]; then
              TARGET_DIR="$HOME/capihouse"
            else
              TARGET_DIR="."
            fi
          fi

          echo "🚀 Subindo serviço capygames-pwa via docker compose em $TARGET_DIR..."
          docker compose --project-directory "$TARGET_DIR" -f "$TARGET_DIR/docker-compose.yml" up -d --force-recreate --no-deps capygames-pwa

          echo "🩺 Verificando status do contêiner..."
          PWA_PORT=$(docker port capygames-pwa 80/tcp 2>/dev/null | head -n 1 | awk -F: '{print $NF}' || echo "80")
          PWA_PORT="${PWA_PORT:-80}"
          HEALTHY=false
          for i in {1..12}; do
            STATUS=$(docker inspect --format='{{.State.Status}}' capygames-pwa 2>/dev/null || echo "not_found")
            if [ "$STATUS" = "running" ]; then
              if command -v curl >/dev/null 2>&1; then
                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:${PWA_PORT}/" || echo "000")
                if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "304" ]; then
                  HEALTHY=true
                  break
                fi
              else
                HEALTHY=true
                break
              fi
            fi
            sleep 3
          done

          if [ "$HEALTHY" = false ]; then
            echo "🚨 Falha na verificação de integridade! Executando rollback..."
            docker logs --tail 30 capygames-pwa || true
            if docker image inspect capygames-pwa:rollback-backup >/dev/null 2>&1; then
              docker tag capygames-pwa:rollback-backup capygames-pwa:latest
              docker compose --project-directory "$TARGET_DIR" -f "$TARGET_DIR/docker-compose.yml" up -d --no-deps capygames-pwa
            fi
            exit 1
          fi

      - name: Limpeza de Imagens Antigas (Prune)
        if: always()
        run: |
          echo "🧹 Limpando imagens órfãs ou antigas..."
          docker image prune -f || true
